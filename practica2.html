<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label>Ingresa tu nombre:</label><br>
    <input type="text" id="nombre">

    <button onclick="saludar()"> saludar </button><br>
    <h1 id="texto"> Aqui se mostrara tu texto: </h1>

    <script>
        function saludar(){
            let elementoNombre = document.getElementById("nombre").value;
            let elementoTexto = document.getElementById("texto");
            elementoTexto.textContent = " hola " + elementoNombre + " bienvenido "
        }
    </script>
</body>
</html>
